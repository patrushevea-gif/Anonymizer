name: Build Windows

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ner,io,crypto]"

      - name: Build executable
        run: pyinstaller build.spec --noconfirm --clean

      - name: Smoke test executable
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/Anonymizer/Anonymizer.exe")) {
            Write-Error "Anonymizer.exe was not produced"
            exit 1
          }
          Write-Host "Build OK: $(Get-Item dist/Anonymizer/Anonymizer.exe | Select-Object -ExpandProperty Length) bytes"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed"
            exit 1
          }
          Get-ChildItem dist_installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AnonymizerRossilber-Installer-${{ github.sha }}
          path: dist_installer/*.exe
          retention-days: 14

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: Anonymizer-windows-${{ github.sha }}
          path: dist/Anonymizer/
          retention-days: 14
