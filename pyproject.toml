[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer"
version = "0.1.0"
description = "Local-only data anonymization tool for Russian documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Anonymizer Team" }]
dependencies = [
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
ner = [
    "natasha>=1.6",
]
io = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
crypto = [
    "cryptography>=42",
    "argon2-cffi>=23",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]
all = [
    "anonymizer[ner,io,crypto,dev]",
]

[project.gui-scripts]
anonymizer = "anonymizer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "ner: tests that require the Natasha NER pipeline",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]
